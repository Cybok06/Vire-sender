    <script id="route-schema" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.viresender.com/#organization",
            "name": "VireSender",
            "url": "https://www.viresender.com/",
            "logo": "https://www.viresender.com/web-app-manifest-512x512.png",
            "description": "VireSender is a business messaging platform for AI-assisted SMS, email campaigns, OTP services, contact management, and developer API messaging."
          },
          {
            "@type": "WebSite",
            "@id": "https://www.viresender.com/#website",
            "name": "VireSender",
            "url": "https://www.viresender.com/",
            "publisher": {
              "@id": "https://www.viresender.com/#organization"
            }
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://www.viresender.com/#software",
            "name": "VireSender",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "url": "https://www.viresender.com/",
            "description": "Bulk SMS, email campaigns, OTP tools, contact management, and VireSend AI for business communication.",
            "offers": {
              "@type": "Offer",
              "priceCurrency": "GHS",
              "availability": "https://schema.org/InStock"
            }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What is VireSend AI?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "VireSend AI is a communication assistant built into VireSender. It helps users create and prepare SMS and email campaigns through natural-language conversation."
                }
              },
              {
                "@type": "Question",
                "name": "Can VireSend AI send SMS and emails?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. You can ask it to prepare an SMS or email for a saved contact group. It can also prepare SMS messages for valid phone numbers that have not been saved as contacts."
                }
              },
              {
                "@type": "Question",
                "name": "Does VireSend AI send messages immediately?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. VireSend AI first prepares a campaign preview containing the recipients, message and relevant campaign details. You must review and confirm the campaign before it is sent."
                }
              },
              {
                "@type": "Question",
                "name": "Can I send an SMS to a phone number that is not saved?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. You can provide a valid phone number directly to VireSend AI. The number is validated, and the assistant prepares the message for your confirmation."
                }
              },
              {
                "@type": "Question",
                "name": "Can VireSend AI send messages to contact groups?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. It can search your saved contact groups and prepare SMS or email campaigns for the selected group."
                }
              },
              {
                "@type": "Question",
                "name": "Can the AI write the message for me?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Tell it the goal, audience and preferred tone. It can generate birthday wishes, announcements, promotional messages, holiday greetings and other business communications."
                }
              },
              {
                "@type": "Question",
                "name": "Can I edit an AI-generated message?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. You can review and edit the subject, message, recipients, Sender ID or sending account before confirming."
                }
              },
              {
                "@type": "Question",
                "name": "Will I see the SMS cost before sending?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. VireSender calculates valid recipients, SMS segments, estimated cost and wallet balance before you confirm an SMS campaign."
                }
              },
              {
                "@type": "Question",
                "name": "Does VireSend AI have access to my passwords or provider keys?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Provider credentials, email tokens, SMTP passwords and internal API keys remain protected on the VireSender backend and are not exposed to the AI assistant."
                }
              },
              {
                "@type": "Question",
                "name": "Can VireSend AI access another user's contacts?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Users can only access contacts, groups, Sender IDs and email accounts belonging to their own VireSender account."
                }
              },
              {
                "@type": "Question",
                "name": "Can I still send campaigns without using AI?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. The normal SMS and email campaign tools remain available. VireSend AI is an additional way to prepare communications faster."
                }
              }
            ]
          }
        ]
      }
    </script>
