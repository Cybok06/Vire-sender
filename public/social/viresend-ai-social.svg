<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">VireSender AI-powered SMS and email campaign platform</title>
  <desc id="desc">VireSender social preview showing AI chat, SMS, email, and campaign review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06142B" />
      <stop offset="55%" stop-color="#0F2347" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#06142B" flood-opacity="0.24" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <circle cx="1020" cy="110" r="180" fill="#0EA5E9" opacity="0.18" />
  <circle cx="180" cy="470" r="220" fill="#2563EB" opacity="0.14" />

  <g transform="translate(86 92)">
    <rect x="0" y="0" rx="26" ry="26" width="74" height="74" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.18)" />
    <text x="22" y="48" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">V</text>
    <text x="96" y="38" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">VireSender</text>
    <text x="96" y="66" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#BFDBFE">SMS, email, OTP and VireSend AI</text>
  </g>

  <g transform="translate(86 212)">
    <text x="0" y="0" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF">Send SMS and Email</text>
    <text x="0" y="78" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF">with VireSend AI</text>
    <text x="0" y="142" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#CBD5E1">
      Tell VireSend AI who you want to contact. Review the campaign,
    </text>
    <text x="0" y="176" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#CBD5E1">
      confirm it, and send SMS or email from one platform.
    </text>

    <g transform="translate(0 222)">
      <rect x="0" y="0" rx="22" ry="22" width="260" height="68" fill="url(#accent)" />
      <text x="34" y="43" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Review before send</text>
    </g>
  </g>

  <g filter="url(#shadow)" transform="translate(700 118)">
    <rect x="0" y="0" rx="34" ry="34" width="414" height="394" fill="#FFFFFF" />
    <rect x="24" y="24" rx="22" ry="22" width="366" height="70" fill="#EFF6FF" />
    <text x="48" y="52" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#2563EB">VireSend AI</text>
    <text x="48" y="76" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#334155">I found one valid phone number and prepared your message for review.</text>

    <rect x="24" y="116" rx="22" ry="22" width="366" height="92" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="48" y="144" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#64748B">SMS message</text>
    <text x="48" y="172" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A">Happy birthday! Wishing you a joyful day</text>
    <text x="48" y="198" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F172A">and a wonderful year ahead.</text>

    <rect x="24" y="228" rx="20" ry="20" width="112" height="78" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="46" y="258" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#64748B">Recipients</text>
    <text x="46" y="286" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#0F172A">1</text>

    <rect x="150" y="228" rx="20" ry="20" width="112" height="78" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="172" y="258" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#64748B">Segments</text>
    <text x="172" y="286" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#0F172A">1</text>

    <rect x="276" y="228" rx="20" ry="20" width="114" height="78" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="298" y="258" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#64748B">Est. cost</text>
    <text x="298" y="286" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#0F172A">GHS 0.04</text>

    <rect x="24" y="326" rx="18" ry="18" width="124" height="42" fill="#FFFFFF" stroke="#CBD5E1" />
    <text x="50" y="353" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#334155">Edit Message</text>

    <rect x="162" y="326" rx="18" ry="18" width="80" height="42" fill="#FFFFFF" stroke="#CBD5E1" />
    <text x="188" y="353" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#334155">Cancel</text>

    <rect x="256" y="326" rx="18" ry="18" width="134" height="42" fill="url(#accent)" />
    <text x="279" y="353" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">Confirm and Send</text>
  </g>
</svg>
