<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>VireSend AI | Send SMS and Email Through Conversation</title>
    <meta
      name="description"
      content="Use VireSend AI to prepare SMS and email campaigns through natural-language conversation. Review recipients, message details and estimated SMS costs before sending."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.viresender.com/ai-assistant" />
    <meta name="application-name" content="VireSender" />
    <meta name="theme-color" content="#06142B" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VireSender" />
    <meta property="og:title" content="VireSender — Send SMS and Email Campaigns with AI" />
    <meta
      property="og:description"
      content="Tell VireSend AI who you want to contact and what you want to say. Review the campaign, confirm it and send SMS or email from one platform."
    />
    <meta property="og:image" content="https://www.viresender.com/social/viresend-ai-social.svg" />
    <meta property="og:url" content="https://www.viresender.com/ai-assistant" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="VireSender AI-powered SMS and email campaign platform" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VireSender — AI-Powered SMS and Email Campaigns" />
    <meta
      name="twitter:description"
      content="Create, review and send SMS and email campaigns through natural-language conversation."
    />
    <meta name="twitter:image" content="https://www.viresender.com/social/viresend-ai-social.svg" />

    <script id="route-schema" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.viresender.com/#organization",
            "name": "VireSender",
            "url": "https://www.viresender.com/",
            "logo": "https://www.viresender.com/web-app-manifest-512x512.png"
          },
          {
            "@type": "WebSite",
            "@id": "https://www.viresender.com/#website",
            "name": "VireSender",
            "url": "https://www.viresender.com/",
            "publisher": {
              "@id": "https://www.viresender.com/#organization"
            }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What is VireSend AI?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "VireSend AI is a communication assistant built into VireSender. It helps users create and prepare SMS and email campaigns through natural-language conversation."
                }
              },
              {
                "@type": "Question",
                "name": "Can VireSend AI send SMS and emails?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. You can ask it to prepare an SMS or email for a saved contact group. It can also prepare SMS messages for valid phone numbers that have not been saved as contacts."
                }
              },
              {
                "@type": "Question",
                "name": "Does VireSend AI send messages immediately?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. VireSend AI first prepares a campaign preview containing the recipients, message and relevant campaign details. You must review and confirm the campaign before it is sent."
                }
              },
              {
                "@type": "Question",
                "name": "Can I send an SMS to a phone number that is not saved?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. You can provide a valid phone number directly to VireSend AI. The number is validated, and the assistant prepares the message for your confirmation."
                }
              },
              {
                "@type": "Question",
                "name": "Can VireSend AI send messages to contact groups?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. It can search your saved contact groups and prepare SMS or email campaigns for the selected group."
                }
              },
              {
                "@type": "Question",
                "name": "Can the AI write the message for me?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Tell it the goal, audience and preferred tone. It can generate birthday wishes, announcements, promotional messages, holiday greetings and other business communications."
                }
              }
            ]
          }
        ]
      }
    </script>

    <style>
      html, body { height: 100%; margin: 0; }
      #root { min-height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
